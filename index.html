<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Cyclamens - Température</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<!-- iOS : ajout à l'écran d'accueil en mode standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyclamens">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main id="pages">

  <section id="page-timer" class="page">
    <h1>Cyclamens</h1>

    <div id="timer-view">
      <div id="timer-display">03:00</div>
      <div id="timer-controls">
        <button id="btn-reset" class="btn-circle btn-circle-secondary" aria-label="Réinitialiser">♻</button>
        <button id="btn-toggle" class="btn-circle btn-circle-primary" aria-label="Démarrer">
          <span class="icon-play"></span>
        </button>
        <button id="btn-period" class="btn-circle btn-circle-secondary" aria-label="Marquer un jour de règles">🩸</button>
      </div>
    </div>

    <div id="temp-view" hidden>
      <p class="hint">Temps écoulé. Saisissez la température.</p>
      <div class="temp-field">
        <input type="number" id="temp-input" step="0.01" inputmode="decimal" placeholder="23.50" autocomplete="off">
        <span class="unit">°C</span>
      </div>
      <button id="btn-save-temp" class="btn btn-primary">Enregistrer</button>
    </div>

    <div id="save-confirm" class="confirm" hidden></div>
  </section>

  <section id="page-chart" class="page" hidden>
    <h1>Historique des températures</h1>

    <div id="range-buttons">
      <button class="range-btn" data-range="7">7j</button>
      <button class="range-btn" data-range="15">15j</button>
      <button class="range-btn" data-range="30">1m</button>
      <button class="range-btn" data-range="90">3m</button>
      <button class="range-btn" data-range="180">6m</button>
      <button class="range-btn" data-range="365">1an</button>
    </div>

    <div id="chart-container">
      <svg id="chart-svg" preserveAspectRatio="none"></svg>
    </div>
    <p id="chart-empty" class="hint" hidden>Aucune donnée pour cette période.</p>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="timer">
    <span class="nav-icon">⏱</span>
    <span>Minuteur</span>
  </button>
  <button class="nav-btn" data-page="chart">
    <span class="nav-icon">📊</span>
    <span>Historique</span>
  </button>
</nav>

<script src="js/db.js"></script>
<script src="js/timer.js"></script>
<script src="js/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
